services:
  dhis2:
    image: "${DHIS2_IMAGE:-dhis2/core:42.5.1}"
    restart: unless-stopped
    volumes:
      - ./config/dhis2/dhis.conf:/opt/dhis2/dhis.conf:ro
    depends_on:
      dhis2-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8080/dhis-web-login/ 2>&1| grep -q 'HTTP.*200'" ]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - dhis2
      - dhis2-db

  dhis2-db:
    image: ghcr.io/baosystems/postgis:13-3.4
    volumes:
      - ./db-dump:/docker-entrypoint-initdb.d/:ro
    environment:
      POSTGRES_USER: dhis
      POSTGRES_DB: dhis
      POSTGRES_PASSWORD: &postgres_password dhis
      PGPASSWORD: *postgres_password
    healthcheck:
      test: [ "CMD-SHELL", "psql --no-password --quiet --username $$POSTGRES_USER postgres://127.0.0.1/$$POSTGRES_DB -p 5432 --command \"SELECT 'ok'\" > /dev/null" ]
      start_period: 120s
      interval: 1s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - dhis2-db

  dhis2-reverse-proxy:
    image: nginx
    restart: always
    depends_on:
      dhis2:
        condition: service_healthy
    ports:
      - "${DHIS2_PORT:-8080}:80"
    volumes:
      - ./config/dhis2/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - dhis2
      - default

  lis:
    image: "hapiproject/hapi:v8.2.0-2-tomcat"
    volumes:
      - ./config/lis/hapi.application.yaml:/data/hapi/application.yaml:ro
      - ./config/lis/uv-lab-report-package.tgz:/package.tgz:ro
    ports:
      - "8081:8080"
    environment:
      SPRING_CONFIG_LOCATION: file:///data/hapi/application.yaml
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo -n '' > /dev/tcp/127.0.0.1/8080" ]
      start_period: 120s
      interval: 5s
      timeout: 1s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - lis

  iol:
    build: ./iol
    restart: always
    environment:
      LIS.API.URL: http://lis:8080/fhir
      DHIS2.API.USERNAME: admin
      DHIS2.API.PASSWORD: district
      DHIS2.API.URL: http://dhis2-reverse-proxy/api
    depends_on:
      seed:
        condition: service_completed_successfully
      lis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - dhis2
      - lis

  seed:
    image: curlimages/curl
    command:
      - "/bin/sh"
      - "-c"
      - |
        curl -X POST -s --max-time 0 -H "Authorization: Basic aGlzcF9hZnJpY2E6RGlzdHJpY3QxIw==" -H "Content-Type: application/json" -d @/diagnosticReportMap.json http://dhis2:8080/api/dataStore/iol/diagnosticReportMap
    volumes:
      - ./config/dhis2/diagnosticReportMap.json:/diagnosticReportMap.json:ro
    depends_on:
      dhis2:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - dhis2

networks:
  dhis2:
  lis:
  dhis2-db:
    internal: true