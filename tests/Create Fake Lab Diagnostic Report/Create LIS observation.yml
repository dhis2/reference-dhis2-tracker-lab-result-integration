info:
  name: Create LIS observation
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:{{lis_port_no}}/fhir/Observation
  body:
    type: json
    data: |-
      {
        "resourceType": "Observation",
        "meta": {
          "profile": [
            "http://hl7.org/fhir/uv/lab-report/StructureDefinition/Observation-resultslab-uv-lab"
          ]
        },
        "status": "final",
        "category": [
          {
            "coding": [
              {
                "system": "http://terminology.hl7.org/CodeSystem/observation-category",
                "code": "laboratory"
              }
            ]
          }
        ],
        "code": {
          "coding": [
            {
              "system": "http://loinc.org",
              "code": "86518-8",
              "display": "Ebola virus RNA [Presence] in Blood by NAA with probe detection"
            }
          ]
        },
        "subject": {
          "reference": "Patient/{{patient_id}}"
        },
        "effectiveDateTime": "2023-03-27T11:24:26+01:00",
        "performer": [
          {
            "display": "Jan Laborant"
          }
        ],
        "dataAbsentReason": {
          "coding": [
            {
              "system": "http://terminology.hl7.org/CodeSystem/data-absent-reason",
              "code": "not-applicable"
            }
          ]
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.runner.skipRequest()
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: observation_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
