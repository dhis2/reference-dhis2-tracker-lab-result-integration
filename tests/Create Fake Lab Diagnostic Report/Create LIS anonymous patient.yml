info:
  name: Create LIS anonymous patient
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:{{lis_port_no}}/fhir/Patient
  body:
    type: json
    data: |-
      {
        "resourceType": "Patient",
        "meta": {
          "profile": [
            "http://hl7.org/fhir/uv/lab-report/StructureDefinition/Patient-uv-lab"
          ]
        },
        "name": [
          {
            "extension": [
              {
                "url": "http://hl7.org/fhir/StructureDefinition/data-absent-reason",
                "valueCode": "unknown"
              }
            ]
          }
        ],
        "_birthDate": {
          "extension": [
            {
              "url": "http://hl7.org/fhir/StructureDefinition/data-absent-reason",
              "valueCode": "unknown"
            }
          ]
        }
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: patient_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
