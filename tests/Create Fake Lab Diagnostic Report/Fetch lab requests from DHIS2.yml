info:
  name: Fetch lab requests from DHIS2
  type: http
  seq: 2

http:
  method: GET
  url: https://implement.im.dhis2.org/lab-ebola/api/tracker/enrollments?program={{program_id}}&status=ACTIVE&fields=events
  params:
    - name: program
      value: "{{program_id}}"
      type: query
    - name: status
      value: ACTIVE
      type: query
    - name: fields
      value: events
      type: query
  auth:
    type: basic
    username: lab-interop
    password: District123!

runtime:
  scripts:
    - type: after-response
      code: |-
        const dataValues = res.body.enrollments.flatMap((et) => et.events.filter((e) => (e.programStage === bru.getCollectionVar("lab_request_program_stage_id")) && (e.status === "COMPLETED")).flatMap((e) => e.dataValues)).filter((dv) => dv.dataElement === bru.getCollectionVar("specimen_data_element_id"));

        for (var dv of dataValues) {
            bru.setVar("specimen_accession_identifier", dv.value);
            await bru.runRequest("Create LIS specimen");
            await bru.runRequest("Create LIS observation");
            await bru.runRequest("Create LIS diagnostic report");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
