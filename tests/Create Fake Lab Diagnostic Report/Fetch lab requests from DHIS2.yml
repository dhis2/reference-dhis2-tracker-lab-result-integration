info:
  name: Fetch lab requests from DHIS2
  type: http
  seq: 2

http:
  method: GET
  url: "{{dhis2.url}}/api/tracker/enrollments?program={{program_id}}&status=ACTIVE&fields=events"
  params:
    - name: program
      value: "{{program_id}}"
      type: query
    - name: status
      value: ACTIVE
      type: query
    - name: fields
      value: events
      type: query
  auth:
    type: basic
    username: lab-interop
    password: District123!

runtime:
  scripts:
    - type: after-response
      code: |-
        const requestSpecimenDv = res.body.enrollments.flatMap((et) => et.events.filter((e) => (e.programStage === bru
            .getCollectionVar("lab_request_program_stage_id")) && (e.status === "COMPLETED")).flatMap((e) => e
            .dataValues.map((dv) => ({
                ...dv,
                event: e.event
            }))).filter((dv) => dv.dataElement === bru.getCollectionVar("specimen_data_element_id")));

        const resultSpecimenDv = res.body.enrollments.flatMap((et) => et.events.filter((e) => (e.programStage === bru
            .getCollectionVar("lab_result_program_stage_id")) && (e.status === "COMPLETED")).flatMap((e) => e.dataValues
            .map((dv) => ({
                ...dv,
                event: e.event
            }))).filter((dv) => dv.dataElement === bru.getCollectionVar("specimen_data_element_id")));

        for (var dv of requestSpecimenDv) {
            var dataValue = dv.value
            if (!resultSpecimenDv.find((r) => r.value === dataValue)) {
                bru.setVar("specimen_accession_identifier", dataValue);
                await bru.runRequest("Create LIS specimen");
                await bru.runRequest("Create LIS observation");
                await bru.runRequest("Create LIS diagnostic report");
            }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
