info:
  name: Fetch lab requests from DHIS2
  type: http
  seq: 2

http:
  method: GET
  url: "{{dhis2.url}}/api/tracker/enrollments?program={{program_id}}&status=ACTIVE&fields=events,attributes&paging=false"
  params:
    - name: program
      value: "{{program_id}}"
      type: query
    - name: status
      value: ACTIVE
      type: query
    - name: fields
      value: events,attributes
      type: query
    - name: paging
      value: "false"
      type: query
  auth:
    type: basic
    username: "{{dhis2_username}}"
    password: "{{dhis2_password}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const requestSpecimen = res.body.enrollments.flatMap((et) =>
           et.events
           .filter(
               (e) =>
               e.programStage ===
               bru.getCollectionVar("lab_request_program_stage_id") &&
               e.status === "COMPLETED",
           )
           .flatMap((e) =>
               e.dataValues.map((dv) => ({
                   ...dv,
                   event: e.event,
                   trackedEntity: et.attributes,
               })),
           )
           .filter(
               (dv) =>
               dv.dataElement === bru.getCollectionVar("specimen_data_element_id"),
           ),
        );

        const resultSpecimen = res.body.enrollments.flatMap((et) =>
           et.events
           .filter(
               (e) =>
               e.programStage ===
               bru.getCollectionVar("lab_result_program_stage_id") &&
               e.status === "COMPLETED",
           )
           .flatMap((e) =>
               e.dataValues.map((dv) => ({
                   ...dv,
                   event: e.event,
               })),
           )
           .filter(
               (dv) =>
               dv.dataElement === bru.getCollectionVar("specimen_data_element_id"),
           ),
        );

        const savedSpecimenIds = [];

        for (var dv of requestSpecimen) {
           const initialDiagnosis = dv.trackedEntity
               .filter((attr) => attr.attribute === "tvaF9No9nkF")
               .map((attr) => attr.value);
           if (initialDiagnosis.length) {
               var dataValue = dv.value;
               bru.setVar("specimen_accession_identifier", dataValue);
               if (
                   !savedSpecimenIds.includes(dataValue) &&
                   !resultSpecimen.find((r) => r.value === dataValue)
               ) {
                   if (initialDiagnosis[0] === "EBOLA") {
                       ebola();
                   }
                   savedSpecimenIds.push(dataValue);
               }
           }
        }

        async function ebola() {
           bru.setVar("75411-9", ["LA11883-8", "LA11882-0"][Math.floor(Math.random() * 2)]);
           bru.setVar("71768-6", ["LA6576-8", "LA6577-6"][Math.floor(Math.random() * 2)]);
           bru.setVar("71770-2", ["LA6576-8", "LA6577-6"][Math.floor(Math.random() * 2)]);
           bru.setVar("41637-0", ["LA6576-8", "LA6577-6"][Math.floor(Math.random() * 2)]);

           await bru.runRequest("create-lis-ebola-diagnostic-report");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
