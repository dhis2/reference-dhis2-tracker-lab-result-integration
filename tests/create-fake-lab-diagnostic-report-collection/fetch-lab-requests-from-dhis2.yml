info:
  name: Fetch lab requests from DHIS2
  type: http
  seq: 1

http:
  method: GET
  url: "{{dhis2.url}}/api/tracker/enrollments?program={{program_id}}&status=ACTIVE&fields=events,attributes&paging=false"
  params:
    - name: program
      value: "{{program_id}}"
      type: query
    - name: status
      value: ACTIVE
      type: query
    - name: fields
      value: events,attributes
      type: query
    - name: paging
      value: "false"
      type: query
  auth:
    type: basic
    username: "{{dhis2_username}}"
    password: "{{dhis2_password}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const requestSpecimen = res.body.enrollments.flatMap((et) =>
           et.events
           .filter(
               (e) =>
               e.programStage ===
               bru.getCollectionVar("lab_request_program_stage_id") &&
               e.status === "COMPLETED",
           )
           .flatMap((e) =>
               e.dataValues.map((dv) => ({
                   ...dv,
                   event: e.event,
                   trackedEntity: et.attributes,
               })),
           )
           .filter(
               (dv) =>
               dv.dataElement === bru.getCollectionVar("specimen_data_element_id"),
           )
        );

        const resultSpecimen = res.body.enrollments.flatMap((et) =>
           et.events
           .filter(
               (e) =>
               e.programStage ===
               bru.getCollectionVar("lab_result_program_stage_id") &&
               e.status === "COMPLETED",
           )
           .flatMap((e) =>
               e.dataValues.map((dv) => ({
                   ...dv,
                   event: e.event,
               })),
           )
           .filter(
               (dv) =>
               dv.dataElement === bru.getCollectionVar("specimen_data_element_id"),
           ),
        );

        const savedSpecimenIds = [];

        for (var dv of requestSpecimen) {
           const initialDiagnosis = dv.trackedEntity
               .filter((attr) => attr.attribute === "tvaF9No9nkF")
               .map((attr) => attr.value);
           if (initialDiagnosis.length) {
               var specimenId = dv.value;
               if (
                   !savedSpecimenIds.includes(specimenId) &&
                   !resultSpecimen.find((r) => r.value === specimenId)
               ) {
                   bru.setVar("specimen_accession_identifier", specimenId);
                   var response;
                   if (initialDiagnosis[0] === "EBOLA") {
                      response = await ebola();
                   } else if (initialDiagnosis[0] === "MPOX") {
                      response = await mpox();
                   } else if (initialDiagnosis[0] === "CHOLERA") {
                      response = await cholera();
                   }
                   if (response.status !== 200) {
                      console.error("Diagnostic report in LIS could not be created", JSON.stringify(response));
                   } else {
                      console.log("Created " + initialDiagnosis[0] + " diagnostic report for specimen " + specimenId);
                   }
                   savedSpecimenIds.push(specimenId);
               }
           }
        }

        async function ebola() {
           bru.setVar("CS_EBOLA_NAAT_ASSAY_TARGET", ["88186-2", "41636-2", "75411-9", "101406-7", "41638-8"][Math.floor(Math.random() * 5)]);
           bru.setVar("CS_LAB_RT_PCR", ["LA11882-0", "LA11883-8", "LA9663-1", "LA13548-5"][Math.floor(Math.random() * 4)]);
           bru.setVar("CS_EBOLA_ORTHOEBOLAVIRUS_SPECIES", ["EBOLA_SP_ZAIRENSE", "EBOLA_SP_SUDANENSE", "EBOLA_SP_BUNDIBUGYOENSE", "EBOLA_SP_TAIENSE", "EBOLA_SP_RESTONENSE", "EBOLA_SP_NOT_DETERMINED", "EBOLA_SP_NONE_DETECTED"][Math.floor(Math.random() * 7)]);
           bru.setVar("71768-6", ["LA6576-8", "LA6577-6", "LA15841-2", "LA11885-3"][Math.floor(Math.random() * 4)]);
           bru.setVar("71712-4", ["LA6576-8", "LA6577-6", "LA15841-2", "LA11885-3"][Math.floor(Math.random() * 4)]);
           bru.setVar("71770-2", ["LA6576-8", "LA6577-6", "LA15841-2", "LA11885-3"][Math.floor(Math.random() * 4)]);
           bru.setVar("CS_EBOLA_SEQUENCING_OUTCOME", ["LAB_SEQ_COMPLETE_GENOME", "LAB_SEQ_PARTIAL_GENOME", "LAB_SEQ_FAILED"][Math.floor(Math.random() * 3)]);

           return await bru.runRequest("create-lis-ebola-diagnostic-report");
        }

        async function mpox() {
           const csMpoxMpxvClade = ["LA34860-9", "LA33581-2", "LA34861-7", "LA34862-5", "LA34863-3", "LA33582-0", "LA33583-8", "LA34855-9"];
           const csLabMolecularDetectionResult = ["LA11882-0", "LA11883-8", "LA9663-1", "LA13548-5"];

           bru.setVar("41853-3", csLabMolecularDetectionResult[Math.floor(Math.random() * csLabMolecularDetectionResult.length)]);
           bru.setVar("100383-9", csLabMolecularDetectionResult[Math.floor(Math.random() * csLabMolecularDetectionResult.length)]);
           bru.setVar("CS_MPOX_CLADE_SPECIFIC_PCR_RESULT", ["100889-5", "106578-8", "106579-6", "100888-7"][Math.floor(Math.random() * 4)]);
           bru.setVar("CS_MPOX_CLADE_SPECIFIC_PCR_RESULT_VALUE", csLabMolecularDetectionResult[Math.floor(Math.random() * csLabMolecularDetectionResult.length)]);
           bru.setVar("106615-8", csMpoxMpxvClade[Math.floor(Math.random() * csMpoxMpxvClade.length)]);
           bru.setVar("CS_MPOX_MPOC_TEST_RESULT", csLabMolecularDetectionResult[Math.floor(Math.random() * csLabMolecularDetectionResult.length)]);
           bru.setVar("101002-4", ["LAB_SEQ_COMPLETE_GENOME", "LAB_SEQ_PARTIAL_GENOME", "LAB_SEQ_FAILED"][Math.floor(Math.random() * 3)]);
           bru.setVar("101003-2", csMpoxMpxvClade[Math.floor(Math.random() * csMpoxMpxvClade.length)]);
           bru.setVar("101004-0", ["B.1", "C.1", "F.1"][Math.floor(Math.random() * 3)]);
        
           return await bru.runRequest("create-lis-mpox-diagnostic-report.yml");
        }

        async function cholera() {
           const cholSg01BiovarCholeraeCodes = ["CHOL_SG_O1_BIOVAR_CHOLERAE", "CHOL_SG_O1_BIOVAR_ELTOR", "CHOL_SG_O139", "CHOL_SG_O1_AND_O139", "CHOL_SG_NEGATIVE", "CHOL_SG_INCONCLUSIVE"];
           const csLabAntimicrobialSusceptibility = ["LAB_AST_SUSCEPTIBLE", "LAB_AST_RESISTANT", "LAB_AST_INCONCLUSIVE"];

           bru.setVar("CS_CHOL_RDT_RESULT_CHOLERA", cholSg01BiovarCholeraeCodes[Math.floor(Math.random() * cholSg01BiovarCholeraeCodes.length)]);
           bru.setVar("6579-7", cholSg01BiovarCholeraeCodes[Math.floor(Math.random() * cholSg01BiovarCholeraeCodes.length)]);
           bru.setVar("CS_CHOL_PCR_RESULT_SEROGROUP", ["97314-9", "61371-1"][Math.floor(Math.random() * 2)]);
           bru.setVar("CS_CHOL_PCR_RESULT_SEROGROUP_VALUE", cholSg01BiovarCholeraeCodes[Math.floor(Math.random() * cholSg01BiovarCholeraeCodes.length)]);
           bru.setVar("80680-2", ["LAB_MOL_DETECTED", "LAB_MOL_NOT_DETECTED", "LAB_MOL_INCONCLUSIVE", "LAB_MOL_SPECIMEN_UNSATISFACTORY"][Math.floor(Math.random() * 4)]);
           bru.setVar("18866-4", csLabAntimicrobialSusceptibility[Math.floor(Math.random() * csLabAntimicrobialSusceptibility.length)]);
           bru.setVar("18906-8", csLabAntimicrobialSusceptibility[Math.floor(Math.random() * csLabAntimicrobialSusceptibility.length)]);
           bru.setVar("18917-5", csLabAntimicrobialSusceptibility[Math.floor(Math.random() * csLabAntimicrobialSusceptibility.length)]);
           bru.setVar("18919-1", csLabAntimicrobialSusceptibility[Math.floor(Math.random() * csLabAntimicrobialSusceptibility.length)]);
           bru.setVar("18963-9", csLabAntimicrobialSusceptibility[Math.floor(Math.random() * csLabAntimicrobialSusceptibility.length)]);
           bru.setVar("18993-6", csLabAntimicrobialSusceptibility[Math.floor(Math.random() * csLabAntimicrobialSusceptibility.length)]);

           return await bru.runRequest("create-lis-cholera-diagnostic-report");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
