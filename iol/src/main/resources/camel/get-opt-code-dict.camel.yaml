- route:
    id: getOptionCodeDictRoute
    description: |
      Builds a mapping between the LOINC codes and the DHIS2 option set value codes.
    from:
      uri: direct:getOptionCodeDict
      steps:
        - to:
            description: |
              Fetches all option values from DHIS2 that have a LOINC code present.
            uri: dhis2:get/collection
            parameters:
              path: options
              arrayName: options
              filter: "{{dhis2.loincCodesAttribute.id}}:!null"
              fields: code,attributeValues
              client: "#dhis2Client"
        - transform:
            description: |
              Builds a list of key-value pairs where the key is the LOINC code and the value is the DHIS2 option value code.
            groovy: |
              body.collectEntries {
                  opt -> opt.attributeValues.find {
                      attr -> attr.attribute.id == '{{dhis2.loincCodesAttribute.id}}'
                  }.value.split(' ').collectEntries {
                      v -> [(v) : opt.code]
                  }
              }
